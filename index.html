<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="../Salwa-Nabawi---Blended-Learning-Environment/env.js" data-site="g3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نمط الدعم المرن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1b6b5a;--teal:#2dd4bf;--accent:#0a8545;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:#f0f4f4;font-family:'Cairo',sans-serif;color:#1f2937;}
body{display:flex;flex-direction:column;min-height:100vh;}
.header{background:#1b4a4a;padding:12px 20px;text-align:center;position:relative;border-bottom:2px solid #14b8a6;min-height:58px;display:flex;align-items:center;justify-content:center;}
.header-title{font-size:14px;font-weight:700;color:#fff;max-width:70%;line-height:1.5;}
.nav{display:flex;justify-content:center;gap:8px;background:#1b5e5e;padding:8px 16px;flex-wrap:wrap;border-bottom:2px solid #0f766e;}
.nav a{color:#e0f2f1;text-decoration:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:50px;border:2px solid rgba(167,243,208,.5);}
.nav a.active{background:#fff;color:var(--primary);border-color:#fff;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 16px;}
.card{background:#fff;border-radius:22px;max-width:440px;width:100%;padding:28px 28px 22px;box-shadow:0 18px 50px rgba(27,74,74,.18);border:1.5px solid #d1fae5;text-align:center;}
.badge{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:800;font-size:13px;padding:5px 16px;border-radius:50px;margin-bottom:10px;}
.ok-ico{width:70px;height:70px;border-radius:50%;background:#ecfdf5;border:2px solid #6ee7b7;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 8px;}
h1{margin:0 0 4px;font-size:22px;color:var(--primary);font-weight:800;}
.sub{margin:0 0 16px;font-size:12.5px;color:#6b7280;line-height:1.8;}
.fg{margin-bottom:13px;text-align:right;}
.fg label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px;}
.inp{position:relative;}
.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;}
.inp input{width:100%;padding:11px 40px 11px 12px;border:2px solid #d1d5db;border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;}
.inp input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.2);}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(10,133,69,.3);}
.btn:disabled{opacity:.6;cursor:wait;}
.err{display:none;background:#fef2f2;color:#b91c1c;border:1.5px solid #fecaca;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px;}
.note{margin-top:14px;font-size:12px;color:#134e4a;background:#f0fdfa;border:1.5px dashed #5eead4;border-radius:12px;padding:9px 12px;line-height:1.8;}
</style>
</head>
<body>
<div class="header"><div class="header-title">بيئة التعلم المدمج لتنمية مهارات إنتاج الدروس التفاعلية لدى طلاب كلية التربية النوعية</div></div>
<nav class="nav"></nav>
<div class="main">
  <div class="card">
    <div class="ok-ico">🎯</div>
    <div class="badge">🔄 نمط الدعم المرن</div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">تم توجيهك إلى البيئة المناسبة لك. سجّل الدخول باسم المستخدم وكلمة المرور للدخول إلى المحتوى التعليمي.</p>
    <div class="err" id="err"></div>
    <div class="fg"><label for="username">اسم المستخدم</label><div class="inp"><span>👤</span><input id="username" type="text" autocomplete="username" dir="ltr" style="text-align:right;" placeholder="أدخل اسم المستخدم"></div></div>
    <div class="fg"><label for="password">كلمة المرور</label><div class="inp"><span>🔒</span><input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور"></div></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="note">📘 اسم المستخدم وكلمة المرور هما نفس بيانات دخولك للبيئة.</div>
  </div>
</div>
<script>
(function(){
  var SITE = ENV.SITE;
  /* لو سجّل الدخول هنا من قبل في نفس الجلسة، أو المحكّم/الباحثة: يدخل المحتوى مباشرة */
  if (ENV.CONFIG.OPEN_MODE || ENV.groupOK(SITE)) { location.replace('mods.html'); return; }
  ['username','password'].forEach(function(id){ document.getElementById(id).addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); }); });
  setTimeout(function(){ document.getElementById('username').focus(); }, 200);
})();
function doLogin(){
  var un = document.getElementById('username').value.trim(), pw = document.getElementById('password').value;
  var err = document.getElementById('err'), btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  if (!un || !pw) { err.textContent = '⚠️ يرجى إدخال اسم المستخدم وكلمة المرور'; err.style.display = 'block'; return; }
  var before = ENV.user();
  if (before && before.u !== un.toLowerCase()) { err.textContent = '⚠️ أدخل بيانات حسابك أنت (' + before.name + ')'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '⏳ جارٍ التحقق...';
  ENV.loginStudent(un, pw).then(function(){
    var a = localStorage.getItem('assignedEnv');
    if (a && a !== ENV.SITE) { location.replace(ENV.url(a, 'index.html')); return; }
    ENV.setGroupOK(ENV.SITE);
    location.replace('mods.html');
  }).catch(function(e){
    btn.disabled = false; btn.textContent = 'دخول';
    err.textContent = '⚠️ ' + ENV.authMsg(e); err.style.display = 'block';
    document.getElementById('password').value = '';
  });
}
</script>
</body>
</html>
